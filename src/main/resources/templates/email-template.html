<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>أُنس | {{subject}}</title>
</head>

<body dir="rtl"
      style="margin:0;padding:0;background-color:#f3f5f2;
             font-family:Tahoma,Arial,sans-serif;color:#253b34;">

<div style="display:none;font-size:1px;line-height:1px;
              max-height:0;max-width:0;opacity:0;
              overflow:hidden;mso-hide:all;">
  {{subject}}
</div>

<table role="presentation" width="100%"
       cellpadding="0" cellspacing="0" border="0"
       style="background-color:#f3f5f2;">
  <tr>
    <td align="center" style="padding:28px 12px;">

      <!--[if mso]>
      <table role="presentation" width="600" align="center">
        <tr><td>
      <![endif]-->

      <table role="presentation" width="100%"
             cellpadding="0" cellspacing="0" border="0"
             style="width:100%;max-width:600px;
                      background-color:#ffffff;
                      border:1px solid #e2e8e1;
                      border-top:5px solid #c5a065;
                      border-radius:14px;">

        <tr>
          <td align="center" style="padding:20px 24px 10px;">
            <img src="{{logoUrl}}"
                 alt="أُنس — لست وحدك، نحن معك"
                 width="190" height="190"
                 style="display:block;width:190px;
                          height:190px;border:0;">
          </td>
        </tr>

        <tr>
          <td align="right" style="padding:0 28px 24px;">

            <table role="presentation"
                   cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="background-color:#eef5f1;
                             border-radius:6px;padding:7px 12px;
                             color:#155b49;font-size:12px;
                             font-weight:bold;">
                  إشعار من نظام أُنس
                </td>
              </tr>
            </table>

            <h1 style="margin:18px 0 12px;font-size:25px;
                         line-height:1.6;color:#155b49;">
              {{subject}}
            </h1>

            <p style="margin:0;font-size:15px;line-height:1.9;">
              السلام عليكم ورحمة الله وبركاته،
            </p>

          </td>
        </tr>

        <tr>
          <td style="padding:0 28px 28px;">

            <table role="presentation" width="100%"
                   cellpadding="0" cellspacing="0" border="0"
                   style="background-color:#f7f8f5;
                            border:1px solid #e6e9e1;
                            border-right:3px solid #c5a065;
                            border-radius:10px;">
              <tr>
                <td align="right"
                    style="padding:20px;font-size:15px;
                             line-height:2;color:#52645d;
                             white-space:pre-line;">{{message}}</td>
              </tr>
            </table>

          </td>
        </tr>

        <tr>
          <td align="center"
              style="padding:21px 24px;
                       border-top:1px solid #e8ece6;">

            <p style="margin:0 0 8px;font-size:15px;
                        font-weight:bold;line-height:1.8;
                        color:#155b49;">
              لست وحدك .. نحن معك
            </p>

            <p style="margin:0;font-size:12px;
                        line-height:1.9;color:#7b877f;">
              رسالة آلية من نظام أُنس لمساعدة الحجاج.
              <br>
              يرجى متابعة التفاصيل عبر النظام.
            </p>

          </td>
        </tr>

      </table>

      <!--[if mso]>
      </td></tr>
      </table>
      <![endif]-->

      <p style="margin:17px 0 0;font-size:11px;
                  line-height:1.8;color:#7b877f;text-align:center;">
        أُنس · رعاية تطمئن، ومساعدة تصل
      </p>

    </td>
  </tr>
</table>

</body>
</html>
