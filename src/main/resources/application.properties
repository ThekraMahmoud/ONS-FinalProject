spring.application.name=ONS

spring.datasource.url=jdbc:mysql://localhost:3306/ons
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

n8n.email-webhook-url=${N8N_EMAIL_WEBHOOK_URL}
n8n.whatsapp-webhook-url=${N8N_WHATSAPP_WEBHOOK_URL}

google.maps.api-key=${GOOGLE_MAPS_API_KEY}

moyasar.secret-key=${MOYASAR_SECRET_KEY}

moyasar.registration-fee-halalas=${MOYASAR_REGISTRATION_FEE_HALALAS:0}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

ons.email-logo-url=https://YOUR_PUBLIC_DOMAIN/images/ons-logo.png